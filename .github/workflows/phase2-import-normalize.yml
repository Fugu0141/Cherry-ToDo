name: Phase 2 import normalization

on:
  push:
    branches:
      - feat/v2-phase2-domain-model

permissions:
  contents: write

jobs:
  normalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v2-phase2-domain-model
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Normalize TypeScript import specifiers
        run: |
          find src test/domain -name '*.ts' -type f -print0 | xargs -0 perl -pi -e "s/\.ts(['\"])/\1/g"
          npm run format
      - name: Commit normalized imports
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: normalize Phase 2 import specifiers"
          git push
