name: V2 UI Parity Patch

on:
  push:
    branches:
      - feat/v2-ui-overhaul-v1-parity

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: python scripts/apply-v2-ui-parity.py
      - run: npx prettier --write src/ui/game/index.ts
      - name: Commit parity controls
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+Fugu0141@users.noreply.github.com"
          git add src/ui/game/index.ts src/ui/game/styles.css
          git commit -m "feat(ui): restore importance and storage clear controls"
          git push
