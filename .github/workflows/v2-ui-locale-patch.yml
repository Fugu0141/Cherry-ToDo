name: V2 UI Locale Patch

on:
  push:
    branches:
      - feat/v2-ui-overhaul-v1-parity

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: python scripts/apply-v2-ui-locale.py
      - run: npx prettier --write src/main.ts src/ui/game/index.ts src/ui/game/onboarding.ts src/ui/game/theme.ts src/ui/game/locale.ts test/e2e/release-critical.spec.ts test/e2e/theme-accessibility.spec.ts
      - name: Commit locale surface
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+Fugu0141@users.noreply.github.com"
          git add src/main.ts src/ui/game/index.ts src/ui/game/onboarding.ts src/ui/game/theme.ts src/ui/game/locale.ts test/e2e/release-critical.spec.ts test/e2e/theme-accessibility.spec.ts
          git commit -m "feat(ui): restore Japanese and English locale controls"
          git push
