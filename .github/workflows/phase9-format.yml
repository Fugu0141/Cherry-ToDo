name: Phase 9 format

on:
  push:
    branches:
      - feat/v2-phase9-migration-interop

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v2-phase9-migration-interop
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prettier --write src/adapters/interop/*.ts src/adapters/migration/**/*.ts test/interop/*.ts test/migration/*.ts
      - name: Commit formatting
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/adapters/interop src/adapters/migration test/interop test/migration
          git commit -m "style: format Phase 9 implementation"
          git push
