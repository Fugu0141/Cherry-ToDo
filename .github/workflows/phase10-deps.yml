name: Phase 10 deps

on:
  push:
    branches:
      - feat/v2-phase10-hardening-release

permissions:
  contents: write

jobs:
  install:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v2-phase10-hardening-release
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm install --save-dev @playwright/test @axe-core/playwright
      - name: Commit dependency lock
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "build: add Phase 10 browser test dependencies"
          git push
