name: Phase 9 lint patch

on:
  push:
    branches:
      - feat/v2-phase9-migration-interop

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v2-phase9-migration-interop
      - run: python scripts/phase9-lint-patch.py
      - run: npx prettier --write src/adapters/migration/v1/index.ts
      - name: Commit patch
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/adapters/migration/v1/index.ts
          git commit -m "fix: tighten V1 migration input boundary"
          git push
