name: Phase 3C History integrator

on:
  push:
    branches:
      - feat/v2-phase3c-history-integration

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v2-phase3c-history-integration
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Integrate snapshot History into ApplicationStore
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/modules/workspace/application/application-store.ts')
          s = p.read_text()

          import_marker = "import type { FlowEdgeId, TabId, TaskId } from '../../../shared/ids/index';"
          s = s.replace(
              import_marker,
              "import { SnapshotHistory, type HistoryState } from '../../history/index';\n" + import_marker,
              1,
          )

          s = s.replace(
              "  | { readonly code: 'invalid-board-point'; readonly taskId: TaskId };",
              "  | { readonly code: 'invalid-board-point'; readonly taskId: TaskId }\n  | { readonly code: 'nothing-to-undo' }\n  | { readonly code: 'nothing-to-redo' };",
              1,
          )

          s = s.replace(
              "  readonly #now: () => string;\n  readonly #pending = new Map<string, PendingMutation>();",
              "  readonly #now: () => string;\n  readonly #pending = new Map<string, PendingMutation>();\n  readonly #history = new SnapshotHistory<WorkspaceDocument>();",
              1,
          )

          s = s.replace(
              "  get workspace(): WorkspaceDocument {\n    return this.#workspace;\n  }",
              "  get workspace(): WorkspaceDocument {\n    return this.#workspace;\n  }\n\n  get historyState(): HistoryState {\n    return this.#history.state;\n  }\n\n  undo(): Result<WorkspaceDocument, ApplicationError> {\n    const previous = this.#history.undo(this.#workspace);\n    if (previous === undefined) return err({ code: 'nothing-to-undo' });\n    this.#pending.clear();\n    this.#workspace = previous;\n    return ok(this.#workspace);\n  }\n\n  redo(): Result<WorkspaceDocument, ApplicationError> {\n    const next = this.#history.redo(this.#workspace);\n    if (next === undefined) return err({ code: 'nothing-to-redo' });\n    this.#pending.clear();\n    this.#workspace = next;\n    return ok(this.#workspace);\n  }",
              1,
          )

          s = s.replace(
              "    this.#pending.delete(planId);\n    this.#workspace = pending.workspace;\n    return ok(this.#workspace);",
              "    this.#pending.delete(planId);\n    return ok(this.#commitCanonical(pending.workspace));",
              1,
          )

          s = s.replace(
              "    this.#workspace = validation.value;\n    return ok({ kind: 'committed', workspace: this.#workspace });",
              "    this.#commitCanonical(validation.value);\n    return ok({ kind: 'committed', workspace: this.#workspace });",
              1,
          )

          s = s.replace(
              "    this.#workspace = validation.value;\n    return ok({ kind: 'committed', workspace: this.#workspace });\n  }\n}",
              "    this.#commitCanonical(validation.value);\n    return ok({ kind: 'committed', workspace: this.#workspace });\n  }\n\n  #commitCanonical(next: WorkspaceDocument): WorkspaceDocument {\n    const previous = this.#workspace;\n    this.#history.record(previous);\n    this.#workspace = next;\n    return this.#workspace;\n  }\n}",
              1,
          )

          p.write_text(s)
          PY
          npx prettier --write src/modules/workspace/application/application-store.ts src/modules/history/application/snapshot-history.ts src/modules/history/index.ts
      - name: Commit integration
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/modules/workspace/application/application-store.ts src/modules/history/application/snapshot-history.ts src/modules/history/index.ts
          git commit -m "feat: integrate History into ApplicationStore"
          git push
