name: Phase 3B polish

on:
  push:
    branches:
      - feat/v2-phase3b-application-mutations

permissions:
  contents: write

jobs:
  polish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v2-phase3b-application-mutations
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Enforce evaluator-owned derived-goal status
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/modules/workspace/application/application-store.ts')
          s = p.read_text()
          old = """    if (task.status === status) {\n      return ok({ kind: 'committed', workspace: this.#workspace });\n    }\n\n    if (status === 'done') {\n      const control = deriveManualCompletionControl(taskId, tab.tasks, graphOf(tab));\n      if (control.kind === 'derived-goal-controlled') {\n        return err({ code: 'derived-goal-controlled', taskId });\n      }\n      if (control.kind === 'blocked-by-merge') {\n        return err({\n          code: 'completion-blocked',\n          taskId,\n          gateTaskIds: control.gateTaskIds,\n          remainingPredecessorIds: control.remainingPredecessorIds,\n        });\n      }\n    }\n"""
          new = """    if (task.status === status) {\n      return ok({ kind: 'committed', workspace: this.#workspace });\n    }\n\n    const control = deriveManualCompletionControl(taskId, tab.tasks, graphOf(tab));\n    if (control.kind === 'derived-goal-controlled') {\n      return err({ code: 'derived-goal-controlled', taskId });\n    }\n    if (status === 'done' && control.kind === 'blocked-by-merge') {\n      return err({\n        code: 'completion-blocked',\n        taskId,\n        gateTaskIds: control.gateTaskIds,\n        remainingPredecessorIds: control.remainingPredecessorIds,\n      });\n    }\n"""
          if old not in s:
              raise SystemExit('target block not found')
          p.write_text(s.replace(old, new))
          PY
          npx prettier --write src/modules/workspace/application/application-store.ts src/modules/workspace/application/semantic-transaction.ts src/modules/workspace/index.ts test/application/application-store.test.ts
      - name: Commit polish
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/modules/workspace/application/application-store.ts src/modules/workspace/application/semantic-transaction.ts src/modules/workspace/index.ts test/application/application-store.test.ts
          git commit -m "fix: polish Phase 3B mutation semantics"
          git push
