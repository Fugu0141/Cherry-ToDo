name: Phase 3B identity guard fixer

on:
  push:
    branches:
      - feat/v2-phase3b-application-mutations

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v2-phase3b-application-mutations
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Add identity collision guards
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/modules/workspace/application/application-store.ts')
          s = p.read_text()
          s = s.replace(
              "  | { readonly code: 'task-not-found'; readonly taskId: TaskId }\n  | { readonly code: 'edge-not-found'; readonly edgeId: FlowEdgeId }",
              "  | { readonly code: 'task-not-found'; readonly taskId: TaskId }\n  | { readonly code: 'task-id-in-use'; readonly taskId: TaskId }\n  | { readonly code: 'edge-not-found'; readonly edgeId: FlowEdgeId }\n  | { readonly code: 'edge-id-in-use'; readonly edgeId: FlowEdgeId }",
          )
          s = s.replace(
              "    const tab = this.#workspace.tabs[tabId];\n    if (tab === undefined) return err({ code: 'tab-not-found', tabId });\n\n    const now = this.#now();\n    const created = createTask({",
              "    const tab = this.#workspace.tabs[tabId];\n    if (tab === undefined) return err({ code: 'tab-not-found', tabId });\n    if (tab.tasks[input.id] !== undefined) {\n      return err({ code: 'task-id-in-use', taskId: input.id });\n    }\n\n    const now = this.#now();\n    const created = createTask({",
              1,
          )
          marker = "    const tab = this.#workspace.tabs[input.tabId];\n    if (tab === undefined) return err({ code: 'tab-not-found', tabId: input.tabId });\n\n    const now = this.#now();"
          replacement = "    const tab = this.#workspace.tabs[input.tabId];\n    if (tab === undefined) return err({ code: 'tab-not-found', tabId: input.tabId });\n    if (tab.flowEdges[input.edgeId] !== undefined) {\n      return err({ code: 'edge-id-in-use', edgeId: input.edgeId });\n    }\n\n    const now = this.#now();"
          if marker not in s:
              raise SystemExit('connectFlow marker not found')
          p.write_text(s.replace(marker, replacement, 1))
          PY
          npx prettier --write src/modules/workspace/application/application-store.ts
      - name: Commit guard
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/modules/workspace/application/application-store.ts
          git commit -m "fix: reject Application identity collisions"
          git push
