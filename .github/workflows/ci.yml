name: V2 CI

on:
  pull_request:
    branches:
      - v2.0
  push:
    branches:
      - v2.0

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply #285 source cleanup
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'src/composition/cherry-ui-runtime.ts';
          let source = fs.readFileSync(path, 'utf8');
          const before = `    if (input.parentTaskId === undefined && input.connectionKind === undefined) {
                return this.#runMutation((store, tabId) => store.createTask(tabId, task));
              }
              if (input.parentTaskId === undefined || input.connectionKind === undefined) {
                return this.#error('validation', 'error.validation');
              }
              const parentTaskId = parseTaskId(input.parentTaskId);
              if (!parentTaskId.ok) return this.#error('validation', 'error.validation');

              return this.#runMutation((store, tabId) =>
                store.createConnectedTask({
                  tabId,
                  task,
                  edgeId: unwrapId(parseFlowEdgeId(randomId('edge'))),
                  kind: input.connectionKind,
                  fromTaskId: parentTaskId.value,
                }),
              );`;
          const after = `    const parentTaskIdRaw = input.parentTaskId;
              const connectionKind = input.connectionKind;
              if (parentTaskIdRaw === undefined && connectionKind === undefined) {
                return this.#runMutation((store, tabId) => store.createTask(tabId, task));
              }
              if (parentTaskIdRaw === undefined || connectionKind === undefined) {
                return this.#error('validation', 'error.validation');
              }
              const parentTaskId = parseTaskId(parentTaskIdRaw);
              if (!parentTaskId.ok) return this.#error('validation', 'error.validation');

              return this.#runMutation((store, tabId) =>
                store.createConnectedTask({
                  tabId,
                  task,
                  edgeId: unwrapId(parseFlowEdgeId(randomId('edge'))),
                  kind: connectionKind,
                  fromTaskId: parentTaskId.value,
                }),
              );`;
          if (!source.includes(before)) {
            console.error('Expected #285 runtime block was not found.');
            process.exit(1);
          }
          source = source.replace(before, after);
          fs.writeFileSync(path, source);
          NODE
          npm run format
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/composition/cherry-ui-runtime.ts src/ui/game/index.ts test/regression/issue-285-atomic-connected-task.test.ts
          if ! git diff --cached --quiet; then
            git commit -m "fix(v2): finish atomic connected task cleanup"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi

      - name: Run V2 quality gates
        run: npm run check
