name: V2 CI

on:
  pull_request:
    branches:
      - v2.0
  push:
    branches:
      - v2.0

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Expose formatting diff
        run: |
          npm run format
          git diff -- src/ui/game/index.ts test/regression/issue-285-atomic-connected-task.test.ts

      - name: Run V2 quality gates
        run: npm run check
