name: Phase 8 core patch

on:
  push:
    branches:
      - feat/v2-phase8-annotations

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v2-phase8-annotations
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: python scripts/phase8_core_patch.py
      - run: npx prettier --write src/modules/workspace/application/application-store.ts src/modules/workspace/index.ts src/modules/annotation/application/annotation-operations.ts src/modules/annotation/domain/annotation.ts src/modules/annotation/index.ts test/domain/phase8-reference-and-annotation.test.ts
      - name: Commit patch
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/modules/workspace/application/application-store.ts src/modules/workspace/index.ts src/modules/annotation src/ui/default/interaction/annotation-drawing.ts src/ui/default/annotation-ui.ts test/domain/phase8-reference-and-annotation.test.ts
          git commit -m "feat: add Phase 8 annotation application model"
          git push
