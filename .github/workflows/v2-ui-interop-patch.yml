name: V2 UI Interop Patch

on:
  push:
    branches:
      - feat/v2-ui-overhaul-v1-parity

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: python scripts/apply-v2-ui-interop.py
      - run: npx prettier --write src/ui-contract/index.ts src/composition/cherry-ui-runtime.ts src/ui/game/index.ts test/contracts/ui-contract.test.ts test/contracts/ui-replaceability.test.ts
      - name: Commit interop surface
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+Fugu0141@users.noreply.github.com"
          git add src/ui-contract/index.ts src/composition/cherry-ui-runtime.ts src/ui/game/index.ts test/contracts/ui-contract.test.ts test/contracts/ui-replaceability.test.ts
          git commit -m "feat(ui): expose CSV and ICS interoperability"
          git push
