name: Phase 8 UI contract patch

on:
  push:
    branches:
      - feat/v2-phase8-annotations

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v2-phase8-annotations
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: python scripts/phase8_ui_contract_patch.py
      - run: npx prettier --write src/ui-contract/index.ts src/ui-contract/i18n.ts src/composition/cherry-ui-runtime.ts src/ui/default/annotation-ui.ts src/ui/default/interaction/annotation-drawing.ts
      - name: Commit patch
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/ui-contract/index.ts src/ui-contract/i18n.ts src/composition/cherry-ui-runtime.ts src/ui/default/annotation-ui.ts src/ui/default/interaction/annotation-drawing.ts
          git commit -m "feat: expose annotations through UI contract and runtime"
          git push
