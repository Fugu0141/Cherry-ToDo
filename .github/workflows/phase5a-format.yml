name: Phase 5A formatter

on:
  push:
    branches:
      - feat/v2-phase5a-ui-contract

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v2-phase5a-ui-contract
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prettier --write src/ui-contract/index.ts src/ui-contract/i18n.ts test/contracts/ui-contract.test.ts
      - name: Commit formatting
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/ui-contract/index.ts src/ui-contract/i18n.ts test/contracts/ui-contract.test.ts
          git commit -m "style: format Phase 5A UI contract"
          git push
