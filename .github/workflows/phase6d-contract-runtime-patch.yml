name: Phase 6D contract runtime patch

on:
  push:
    branches:
      - feat/v2-phase6d-desktop-hardening

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v2-phase6d-desktop-hardening
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Fix patch fixture target
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/phase6d_contract_runtime_patch.py')
          s = p.read_text()
          s = s.replace(
              "      setSchedule: ok,\n    },\n    flow: { connect: ok },",
              "      setSchedule: ok,\n    },\n    board: { dropTask: ok },\n    flow: { connect: ok },",
          )
          s = s.replace(
              "      setSchedule: ok,\n      deleteOnly: ok,\n      deleteDownstream: ok,\n    },\n    flow: { connect: ok, disconnect: ok, reorder: ok },",
              "      setSchedule: ok,\n      deleteOnly: ok,\n      deleteDownstream: ok,\n    },\n    board: { dropTask: ok },\n    flow: { connect: ok, disconnect: ok, reorder: ok },",
          )
          p.write_text(s)
          PY
      - run: python scripts/phase6d_contract_runtime_patch.py
      - run: npx prettier --write src/ui-contract/index.ts src/ui-contract/i18n.ts src/composition/cherry-ui-runtime.ts test/contracts/ui-contract.test.ts
      - name: Commit patch
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/ui-contract/index.ts src/ui-contract/i18n.ts src/composition/cherry-ui-runtime.ts test/contracts/ui-contract.test.ts
          git commit -m "feat: expose desktop maintenance intents"
          git push
