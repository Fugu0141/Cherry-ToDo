name: V2 UI E2E Debug

on:
  push:
    branches:
      - feat/v2-ui-overhaul-v1-parity

permissions:
  contents: read

jobs:
  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --project=mobile-chromium --max-failures=1 --reporter=line
