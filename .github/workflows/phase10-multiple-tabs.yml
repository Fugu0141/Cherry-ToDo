name: Phase 10 multiple-tab hardening

on:
  push:
    branches:
      - feat/v2-phase10-hardening-release

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v2-phase10-hardening-release
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: python scripts/phase10-multiple-tabs.py
      - name: Update presentation fixture for tab summaries
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('test/interaction/mobile-flow-presentation.test.ts')
          text = path.read_text()
          old = """    tabId: 'tab-1',\n    tabName: 'Main',\n    activeView: 'list',\n"""
          new = """    tabId: 'tab-1',\n    tabName: 'Main',\n    tabs: [{ id: 'tab-1', name: 'Main' }],\n    activeView: 'list',\n"""
          if old not in text:
              raise SystemExit('mobile Flow presentation fixture anchor not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - run: npx prettier --write src/modules/workspace/application/application-store.ts src/ui-contract/index.ts src/ui-contract/i18n.ts src/composition/cherry-ui-runtime.ts src/ui/default/index.ts src/ui/default/styles.css src/ui/default/theme.css test/contracts/ui-contract.test.ts test/contracts/ui-replaceability.test.ts test/application/application-store.test.ts test/interaction/mobile-flow-presentation.test.ts test/e2e/release-critical.spec.ts
      - run: npm run check
      - name: Commit patch
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/modules/workspace/application/application-store.ts src/ui-contract/index.ts src/ui-contract/i18n.ts src/composition/cherry-ui-runtime.ts src/ui/default/index.ts src/ui/default/styles.css src/ui/default/theme.css test/contracts/ui-contract.test.ts test/contracts/ui-replaceability.test.ts test/application/application-store.test.ts test/interaction/mobile-flow-presentation.test.ts test/e2e/release-critical.spec.ts
          git commit -m "feat: complete multiple planning tab support"
          git push
