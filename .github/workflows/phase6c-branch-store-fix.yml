name: Phase 6C branch store fix

on:
  push:
    branches:
      - feat/v2-phase6c-flow-visuals

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v2-phase6c-flow-visuals
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: python scripts/phase6c_branch_order_store_fix.py
      - run: npx prettier --write src/composition/cherry-ui-runtime.ts src/modules/workspace/application/application-store.ts
      - name: Commit patch
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/composition/cherry-ui-runtime.ts src/modules/workspace/application/application-store.ts
          git commit -m "fix: allocate branch order in ApplicationStore"
          git push
