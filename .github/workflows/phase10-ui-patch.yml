name: Phase 10 UI patch

on:
  push:
    branches:
      - feat/v2-phase10-hardening-release

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v2-phase10-hardening-release
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: python scripts/phase10-ui-hardening.py
      - run: npx prettier --write src/ui/default/index.ts
      - name: Commit patch
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/ui/default/index.ts
          git commit -m "fix: harden default UI accessibility semantics"
          git push
