name: Phase 7C mobile Flow patch

on:
  push:
    branches:
      - feat/v2-phase7c-mobile-flow-ux

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v2-phase7c-mobile-flow-ux
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: python scripts/phase7c_mobile_flow_patch.py
      - run: npx prettier --write src/ui-contract/index.ts src/ui-contract/i18n.ts src/ui/default/index.ts src/ui/default/interaction/mobile-board-interaction.ts src/ui/default/interaction/mobile-connection-flow.ts src/ui/default/interaction/mobile-flow-presentation.ts test/interaction/mobile-connection-flow.test.ts test/interaction/mobile-flow-presentation.test.ts test/integration/phase7-mobile-flow.test.ts
      - name: Commit patch
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/ui-contract/index.ts src/ui-contract/i18n.ts src/ui/default/index.ts src/ui/default/styles.css src/ui/default/interaction/mobile-board-interaction.ts
          git commit -m "feat: complete mobile flow-first interaction UX"
          git push
