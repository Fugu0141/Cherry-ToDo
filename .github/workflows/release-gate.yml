name: V2 Release Gate

on:
  pull_request:
    branches:
      - v2.0
  push:
    branches:
      - v2.0

permissions:
  contents: read

jobs:
  browser-release:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run V2 static and headless gates
        run: npm run check

      - name: Report production bundle metrics
        run: npm run metrics

      - name: Verify static deployment output
        run: npm run static:verify

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run desktop/mobile browser release journeys
        run: npm run test:e2e
