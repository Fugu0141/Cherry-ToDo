name: Phase 4A formatter

on:
  push:
    branches:
      - feat/v2-phase4a-repository-codec

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v2-phase4a-repository-codec
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prettier --write src/adapters/persistence/browser/index.ts src/adapters/persistence/memory/index.ts
      - name: Commit formatting
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/adapters/persistence/browser/index.ts src/adapters/persistence/memory/index.ts
          git commit -m "style: format Phase 4A repositories"
          git push
