name: Phase 6D type fix

on:
  push:
    branches:
      - feat/v2-phase6d-desktop-hardening

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v2-phase6d-desktop-hardening
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Fix noUncheckedIndexedAccess reorder swaps
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/ui/default/index.ts')
          s = p.read_text()
          old = '[next[index - 1], next[index]] = [next[index], next[index - 1]];'
          new = '''const current = next[index];
          const previous = next[index - 1];
          if (current === undefined || previous === undefined) return;
          next[index - 1] = current;
          next[index] = previous;'''
          if old not in s:
              raise SystemExit('earlier swap target not found')
          s = s.replace(old, new, 1)
          old = '[next[index], next[index + 1]] = [next[index + 1], next[index]];'
          new = '''const current = next[index];
          const following = next[index + 1];
          if (current === undefined || following === undefined) return;
          next[index] = following;
          next[index + 1] = current;'''
          if old not in s:
              raise SystemExit('later swap target not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - run: npx prettier --write src/ui/default/index.ts
      - name: Commit patch
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/ui/default/index.ts
          git commit -m "fix: satisfy strict reorder indexing"
          git push
