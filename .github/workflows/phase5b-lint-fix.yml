name: Phase 5B lint fix

on:
  push:
    branches:
      - feat/v2-phase5b-default-ui-shell

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v2-phase5b-default-ui-shell
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply targeted fixes
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/composition/cherry-ui-runtime.ts')
          s = p.read_text()
          s = s.replace("  type TabId,\n", "  type TabId,\n  type TaskId,\n")
          s = s.replace("  type CherryTaskImportance,\n", "")
          old = '''  async #withTaskId(\n    rawId: string,\n    action: (\n      taskId: ReturnType<\n        typeof unwrapId<ReturnType<typeof parseTaskId> extends { value: infer T } ? T : never>\n      >,\n    ) => Promise<UIActionResult>,\n  ): Promise<UIActionResult> {'''
          new = '''  async #withTaskId(\n    rawId: string,\n    action: (taskId: TaskId) => Promise<UIActionResult>,\n  ): Promise<UIActionResult> {'''
          if old not in s:
              raise SystemExit('withTaskId target not found')
          s = s.replace(old, new)
          old = '''  async #cancel(planId: string): Promise<UIActionResult> {\n    if (this.#store === null) return this.#error('not-found', 'error.notFound');\n    const result = this.#store.cancelMutation(planId);\n    if (!result.ok) return { kind: 'error', error: presentationError(result.error) };\n    this.#refreshWorkspace();\n    return OK;\n  }'''
          new = '''  #cancel(planId: string): Promise<UIActionResult> {\n    if (this.#store === null) {\n      return Promise.resolve(this.#error('not-found', 'error.notFound'));\n    }\n    const result = this.#store.cancelMutation(planId);\n    if (!result.ok) {\n      return Promise.resolve({ kind: 'error', error: presentationError(result.error) });\n    }\n    this.#refreshWorkspace();\n    return Promise.resolve(OK);\n  }'''
          if old not in s:
              raise SystemExit('cancel target not found')
          s = s.replace(old, new)
          s = s.replace("          importance: task.appearance.importance as CherryTaskImportance,", "          importance: task.appearance.importance,")
          p.write_text(s)
          PY
      - run: npx prettier --write src/composition/cherry-ui-runtime.ts
      - name: Commit fixes
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/composition/cherry-ui-runtime.ts
          git commit -m "fix: tighten Phase 5B UI runtime types"
          git push
