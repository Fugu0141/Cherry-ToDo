name: Phase 5B formatter

on:
  push:
    branches:
      - feat/v2-phase5b-default-ui-shell

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v2-phase5b-default-ui-shell
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prettier --write src/composition/cherry-ui-runtime.ts src/composition/bootstrap.ts src/ui/default/index.ts src/main.ts
      - name: Commit formatting
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/composition/cherry-ui-runtime.ts src/composition/bootstrap.ts src/ui/default/index.ts src/main.ts
          git commit -m "style: format Phase 5B UI shell"
          git push
