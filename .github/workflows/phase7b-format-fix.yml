name: Phase 7B format fix

on:
  push:
    branches:
      - feat/v2-phase7b-mobile-board-interaction

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v2-phase7b-mobile-board-interaction
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prettier --write src/ui/default/interaction/mobile-board-interaction.ts
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/ui/default/interaction/mobile-board-interaction.ts
          git commit -m "style: format mobile Board interaction"
          git push
