name: Phase 10 format

on:
  push:
    branches:
      - feat/v2-phase10-hardening-release

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v2-phase10-hardening-release
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prettier --write src/ui/minimal-test/index.ts test/e2e/*.ts scripts/report-build-metrics.mjs
      - name: Commit formatting
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/ui/minimal-test test/e2e scripts/report-build-metrics.mjs
          git commit -m "style: format Phase 10 release harness"
          git push
