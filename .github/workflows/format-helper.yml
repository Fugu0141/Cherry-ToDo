name: Format Helper

on:
  pull_request:
    branches: [v2.0]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Format changed files
        run: >-
          npx prettier --write
          src/modules/board/domain/layout.ts
          src/modules/workspace/application/application-store.ts
          test/regression/issue-286-stale-manual-position.test.ts
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/modules/board/domain/layout.ts src/modules/workspace/application/application-store.ts test/regression/issue-286-stale-manual-position.test.ts
          git commit -m "style(v2): apply Prettier output for #286"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
