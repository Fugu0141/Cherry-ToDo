name: Format Helper

on:
  pull_request:
    branches: [v2.0]

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Format changed files
        run: >-
          npx prettier --write
          src/modules/board/domain/layout.ts
          src/modules/workspace/application/application-store.ts
          test/regression/issue-286-stale-manual-position.test.ts
      - uses: actions/upload-artifact@v4
        with:
          name: formatted-286
          path: |
            src/modules/board/domain/layout.ts
            src/modules/workspace/application/application-store.ts
            test/regression/issue-286-stale-manual-position.test.ts
