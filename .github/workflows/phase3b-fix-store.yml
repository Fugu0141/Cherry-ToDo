name: Phase 3B store fixer

on:
  push:
    branches:
      - feat/v2-phase3b-application-mutations

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v2-phase3b-application-mutations
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Fix reviewed ApplicationStore issues
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/modules/workspace/application/application-store.ts')
          s = p.read_text()
          s = s.replace("\nfunction stableTaskIds(ids: Iterable<TaskId>): readonly TaskId[] {\n  return [...new Set(ids)].sort((left, right) => left.localeCompare(right));\n}\n", "")
          s = s.replace("\nfunction structuralIncidentEdges(taskId: TaskId, graph: FlowGraph): readonly StructuralFlowEdge[] {\n  return [...incomingStructuralEdges(taskId, graph), ...outgoingStructuralEdges(taskId, graph)];\n}\n", "")
          s = s.replace("\n    const graph = graphOf(tab);\n    const structural = Object.values(tab.flowEdges).filter(", "\n    const structural = Object.values(tab.flowEdges).filter(")
          s = s.replace("    return this.#commitWorkspace(tabId, tab, updatedAt).ok\n      ? ok({ kind: 'committed', workspace: this.#workspace })\n      : this.#commitWorkspace(tabId, tab, updatedAt);", "    return this.#commitWorkspace(tabId, tab, updatedAt);")
          p.write_text(s)
          PY
          npx prettier --write src/modules/workspace/application/application-store.ts src/modules/workspace/application/semantic-transaction.ts
      - name: Commit fixes
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/modules/workspace/application/application-store.ts src/modules/workspace/application/semantic-transaction.ts
          git commit -m "fix: review Phase 3B ApplicationStore"
          git push
