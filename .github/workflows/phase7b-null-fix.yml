name: Phase 7B nullability fix

on:
  push:
    branches:
      - feat/v2-phase7b-mobile-board-interaction

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v2-phase7b-mobile-board-interaction
      - run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/ui/default/interaction/mobile-board-interaction.ts')
          s=p.read_text()
          old="""  return () => {
            if (drag?.frame !== null) window.cancelAnimationFrame(drag.frame);
            if (drag !== null) restoreCard(drag);
            drag = null;"""
          new="""  return () => {
            const activeDrag = drag;
            if (activeDrag?.frame !== null && activeDrag !== null) {
              window.cancelAnimationFrame(activeDrag.frame);
            }
            if (activeDrag !== null) restoreCard(activeDrag);
            drag = null;"""
          if old not in s:
              raise SystemExit('cleanup target not found')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/ui/default/interaction/mobile-board-interaction.ts
          git commit -m "fix: narrow active mobile drag cleanup"
          git push
