name: Phase 6B application patch

on:
  push:
    branches:
      - feat/v2-phase6b-drop-intents

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v2-phase6b-drop-intents
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply ApplicationStore drop command
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/modules/workspace/application/application-store.ts')
          s = p.read_text()
          old = """import {\n  validateSchedule,\n  type Schedule,\n  type ScheduleValidationError,\n} from '../../schedule/index';\nimport { validateBoardDocumentState, type BoardSettings, type Point } from '../../board/index';"""
          new = """import {\n  noSchedule,\n  scheduleAtDateTime,\n  scheduleOnDate,\n  validateSchedule,\n  type Schedule,\n  type ScheduleValidationError,\n} from '../../schedule/index';\nimport {\n  validateBoardDocumentState,\n  type BoardPlacementDropIntent,\n  type BoardSettings,\n  type Point,\n} from '../../board/index';"""
          if old not in s:
              raise SystemExit('import target not found')
          s = s.replace(old, new, 1)

          marker = """  connectFlow(input: ConnectFlowInput): Result<MutationOutcome, ApplicationError> {"""
          method = """  applyBoardDrop(\n    tabId: TabId,\n    taskId: TaskId,\n    intent: BoardPlacementDropIntent,\n  ): Result<MutationOutcome, ApplicationError> {\n    if (intent.kind === 'cancel') {\n      return ok({ kind: 'committed', workspace: this.#workspace });\n    }\n\n    if (intent.kind === 'visual-move') {\n      return this.moveTask(tabId, taskId, intent.point);\n    }\n\n    const resolved = this.#resolveTask(tabId, taskId);\n    if (!resolved.ok) return resolved;\n    const { tab, task } = resolved.value;\n\n    let nextSchedule: Schedule;\n    if (intent.date === null) {\n      nextSchedule = noSchedule();\n    } else if (task.schedule.kind === 'datetime') {\n      const scheduled = scheduleAtDateTime(\n        intent.date,\n        task.schedule.time,\n        task.schedule.timeZone,\n      );\n      if (!scheduled.ok) return err({ code: 'schedule-invalid', cause: scheduled.error });\n      nextSchedule = scheduled.value;\n    } else {\n      const scheduled = scheduleOnDate(intent.date);\n      if (!scheduled.ok) return err({ code: 'schedule-invalid', cause: scheduled.error });\n      nextSchedule = scheduled.value;\n    }\n\n    const now = this.#now();\n    const updatedTask: Task = {\n      ...task,\n      schedule: nextSchedule,\n      meta: bumpMeta(task.meta, now),\n    };\n    const taskValidation = validateTask(updatedTask);\n    if (!taskValidation.ok) return err({ code: 'task-invalid', cause: taskValidation.error });\n\n    const board =\n      intent.point === undefined\n        ? tab.board\n        : {\n            ...tab.board,\n            positions: { ...tab.board.positions, [taskId]: intent.point },\n          };\n    const boardValidation = validateBoardDocumentState(\n      Object.values(tab.tasks).map((candidate) => candidate.id),\n      board,\n    );\n    if (!boardValidation.ok) return err({ code: 'invalid-board-point', taskId });\n\n    return this.#commitSimpleTab(\n      tabId,\n      {\n        ...tab,\n        tasks: { ...tab.tasks, [taskId]: taskValidation.value },\n        board: boardValidation.value,\n      },\n      now,\n    );\n  }\n\n"""
          if marker not in s:
              raise SystemExit('connectFlow marker not found')
          s = s.replace(marker, method + marker, 1)
          p.write_text(s)
          PY
      - run: npx prettier --write src/modules/workspace/application/application-store.ts
      - name: Commit patch
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/modules/workspace/application/application-store.ts
          git commit -m "feat: apply Board drops atomically"
          git push
