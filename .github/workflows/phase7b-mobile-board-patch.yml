name: Phase 7B mobile Board patch

on:
  push:
    branches:
      - feat/v2-phase7b-mobile-board-interaction

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v2-phase7b-mobile-board-interaction
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: python scripts/phase7b_mobile_board_patch.py
      - run: npx prettier --write src/ui/default/index.ts src/ui/default/interaction/mobile-board-interaction.ts test/interaction/mobile-board-interaction.test.ts
      - name: Commit patch
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/ui/default/index.ts src/ui/default/styles.css src/ui/default/interaction/mobile-board-interaction.ts test/interaction/mobile-board-interaction.test.ts
          git commit -m "feat: wire mobile Board interaction ownership"
          git push
