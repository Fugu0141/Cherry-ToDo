name: V2 UI Fix Import
on:
  push:
    branches: [feat/v2-ui-overhaul-v1-parity]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/ui/game/index.ts')
          s=p.read_text()
          s=s.replace('  CherryTaskImportance,\n','')
          p.write_text(s)
          PY
      - name: Commit fix
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/ui/game/index.ts
          git commit -m "fix(ui): remove unused game UI import"
          git push
