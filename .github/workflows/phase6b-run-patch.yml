name: Phase 6B run patch

on:
  push:
    branches:
      - feat/v2-phase6b-drop-intents

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v2-phase6b-drop-intents
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: python scripts/phase6b_drag_ui_patch.py
      - run: npx prettier --write src/ui/default/index.ts
      - name: Commit patch
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/ui/default/index.ts
          git commit -m "feat: add desktop Board drag and lane drop UI"
          git push
