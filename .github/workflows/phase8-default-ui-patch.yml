name: Phase 8 default UI patch

on:
  push:
    branches:
      - feat/v2-phase8-annotations

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v2-phase8-annotations
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: python scripts/phase8_default_ui_patch.py
      - run: npx prettier --write src/ui/default/index.ts src/ui/default/interaction/mobile-board-interaction.ts src/ui/default/annotation-ui.ts src/ui/default/interaction/annotation-drawing.ts test/application/phase8-annotations.test.ts test/integration/phase8-annotation-persistence.test.ts test/interaction/phase8-drawing-owner.test.ts
      - name: Commit patch
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+Fugu0141@users.noreply.github.com"
          git add src/ui/default/index.ts src/ui/default/styles.css src/ui/default/interaction/mobile-board-interaction.ts src/ui/default/annotation-ui.ts src/ui/default/interaction/annotation-drawing.ts test/application/phase8-annotations.test.ts test/integration/phase8-annotation-persistence.test.ts test/interaction/phase8-drawing-owner.test.ts
          git commit -m "feat: wire Phase 8 freehand annotation UI"
          git push
