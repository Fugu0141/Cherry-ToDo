name: Phase 10 requirement hardening

on:
  push:
    branches:
      - feat/v2-phase10-hardening-release

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v2-phase10-hardening-release
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Normalize temporary patch anchors
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/phase10-requirement-hardening.py')
          text = path.read_text()
          old = '''# Contract tests must implement the expanded contract.\nfor path in ['test/contracts/ui-contract.test.ts', 'test/contracts/ui-replaceability.test.ts']:\n    replace(path, "storage: { allow: ok, notNow: ok },", "storage: { allow: ok, notNow: ok, disable: ok },")\n    replace(\n        path,\n        """        persistentStorageAvailable: true,\\n        boardView: true,\\n""",\n        """        persistentStorageAvailable: true,\\n        persistentStorageEnabled: false,\\n        boardView: true,\\n""",\n    )\n'''
          new = '''# Contract tests must implement the expanded contract.\nfor path in ['test/contracts/ui-contract.test.ts', 'test/contracts/ui-replaceability.test.ts']:\n    replace(path, "storage: { allow: ok, notNow: ok },", "storage: { allow: ok, notNow: ok, disable: ok },")\nreplace(\n    'test/contracts/ui-contract.test.ts',\n    """        persistentStorageAvailable: true,\\n        boardView: true,\\n""",\n    """        persistentStorageAvailable: true,\\n        persistentStorageEnabled: false,\\n        boardView: true,\\n""",\n)\nreplace(\n    'test/contracts/ui-replaceability.test.ts',\n    """      persistentStorageAvailable: true,\\n      boardView: true,\\n""",\n    """      persistentStorageAvailable: true,\\n      persistentStorageEnabled: false,\\n      boardView: true,\\n""",\n)\n'''
          if old not in text:
              raise SystemExit('temporary contract-test patch block not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - run: python scripts/phase10-requirement-hardening.py
      - run: npx prettier --write src/ui-contract/index.ts src/ui-contract/i18n.ts src/composition/cherry-ui-runtime.ts src/ui/default/index.ts test/contracts/ui-contract.test.ts test/contracts/ui-replaceability.test.ts
      - name: Commit patch
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/ui-contract/index.ts src/ui-contract/i18n.ts src/composition/cherry-ui-runtime.ts src/ui/default/index.ts src/ui/default/styles.css src/ui/default/theme.css test/contracts/ui-contract.test.ts test/contracts/ui-replaceability.test.ts
          git commit -m "fix: complete storage settings and goal importance UX"
          git push
