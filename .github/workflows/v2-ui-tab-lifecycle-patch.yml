name: V2 UI Tab Lifecycle Patch

on:
  push:
    branches:
      - feat/v2-ui-overhaul-v1-parity

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: python scripts/apply-v2-ui-tab-lifecycle.py
      - run: npx prettier --write src/modules/workspace/application/application-store.ts src/ui-contract/index.ts src/composition/cherry-ui-runtime.ts src/ui/game/index.ts test
      - name: Commit patch
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+Fugu0141@users.noreply.github.com"
          git add src/modules/workspace/application/application-store.ts src/ui-contract/index.ts src/composition/cherry-ui-runtime.ts src/ui/game/index.ts src/ui/game/styles.css test
          git commit -m "feat(ui): restore tab lifecycle actions"
          git push
